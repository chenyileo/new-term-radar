{"name":"TTS","on":{"workflow_dispatch":{},"push":{"paths":["tts/script.txt"]}},"permissions":{"contents":"write"},"jobs":{"tts":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"run":"pip install edge-tts"},{"run":"mkdir -p out\nfor v in zh-CN-YunxiNeural zh-CN-YunjianNeural zh-CN-YunyangNeural zh-CN-XiaoxiaoNeural; do\n  edge-tts --voice $v --rate=+5% --file tts/script.txt --write-media out/$v.mp3 --write-subtitles out/$v.vtt || echo failed $v\ndone\nls -la out"},{"run":"git config user.name github-actions\ngit config user.email actions@github.com\ngit checkout --orphan tts-out\ngit rm -rf . -q\ncp out/* .\ngit add -f *.mp3 *.vtt\ngit commit -m tts\ngit push -f origin tts-out"}]}}}
